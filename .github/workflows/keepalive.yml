name: instabox-keepalive

# 每 5 分钟向 instabox 沙箱发起一次 SSH 握手，避免实例闲置被判为 idle 而暂停。
# 凭证只从 Actions Secret 读取，仓库里不出现任何 token。
#
# 另外：公开仓库的 schedule 在连续 60 天无仓库活动后会被 GitHub 自动禁用，
# 所以每天首次运行时顺便提交一次 .state/last-active 作为"活动标记"。
# 不做成每次运行都提交——5 分钟一次等于一天 288 个 commit，纯属污染历史。

on:
  schedule:
    - cron: "*/5 * * * *"   # UTC，实际触发常延迟 1-10 分钟
  workflow_dispatch:        # 手动触发一次，用来验证凭证是否配对
  push:
    branches: [main]

concurrency:
  group: instabox-keepalive
  cancel-in-progress: false

permissions:
  contents: write          # 下拉代码 + 推送每日活动标记

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        if: github.event_name != 'push'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: SSH heartbeat
        env:
          IB_USER: ${{ secrets.INSTABOX_SSH_USER }}
          IB_HOST: ssh.instabox.sh
          IB_PORT: "2222"
        run: |
          set -uo pipefail

          if [ -z "${IB_USER}" ]; then
            echo "::error::缺少 secret INSTABOX_SSH_USER"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # keyscan 失败不应中断流程：ssh 自己也带 accept-new 兜底。
          ssh-keyscan -p "${IB_PORT}" "${IB_HOST}" >> ~/.ssh/known_hosts 2>/dev/null \
            || echo "::warning::ssh-keyscan 未取到主机密钥，改用 accept-new"

          # 该实例"用户名即 token"，没有密码也没有密钥。
          # 必须关掉公钥/密码/交互式认证，否则 ssh 会在非交互环境里卡住等待输入。
          echo "--- connectivity ---"
          timeout 20 bash -c "cat < /dev/null > /dev/tcp/${IB_HOST}/${IB_PORT}" \
            && echo "tcp ${IB_HOST}:${IB_PORT} open" \
            || echo "tcp ${IB_HOST}:${IB_PORT} BLOCKED"

          ssh -p "${IB_PORT}" \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="${HOME}/.ssh/known_hosts" \
              -o BatchMode=yes \
              -o PubkeyAuthentication=no \
              -o PasswordAuthentication=no \
              -o KbdInteractiveAuthentication=no \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=4 \
              "${IB_USER}@${IB_HOST}" \
              'echo "alive at $(date -u +%FT%TZ)"; uptime'

      - name: Keep repository active
        # 即使握手失败也要跑：不能让"60 天无活动"因为沙箱临时故障就把定时任务停掉。
        if: always() && github.event_name != 'push'
        run: |
          set -euo pipefail
          today="$(date -u +%F)"
          last="$(cat .state/last-active 2>/dev/null || echo '')"

          if [ "${last}" = "${today}" ]; then
            echo "今天（${today}）已经打点，跳过"
            exit 0
          fi

          mkdir -p .state
          printf '%s\n' "${today}" > .state/last-active
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .state/last-active
          git commit -m "chore(keepalive): 活动标记 ${today}"
          # 并发时远端可能已前进，rebase 后重试一次。
          git push || { git pull --rebase --autostash && git push; }
